# RoadBook 主插件（组合包 patch）
#
# 一个组合包 = 一份 patch + 若干 Loader 行。这里插一条 group 行（`roadbook-bundle`；
# 面板不显示它）挂四个子行，每个子行都是 DSH 插件面板里一条可独立开关的项：
#   roadbook            主行：版本号与随包文件自检（lib/index.js）
#   roadbook-skills     技能根：把包内 skills/ 交给 skill 子系统（roadbook + roadbook-atlas 两个技能）
#   roadbook-autoload   自动加载：命中触发词时把流程正文注入当前回合（Host 半在 plugin/roadbook-autoload）
#   roadbook-atlas      图纸工作台：宿主半 + 侧栏「图册」标签页（客户端半在 lib/client.js）
#
# 三处开关：① 插件面板里关某一行；② profile 的 cordis.patch.yml 里写 `- id: <行 id>` + `disabled: true`；
# ③ 关主行 roadbook = 四个子行一起停（group 行的 disabled 读主行自身的开关，不递归读自己）。
#
# 只列与默认值不同的项。改配置直接改下面的 config，改完重新启用或刷新生效。
- insert:
    - id: roadbook-bundle
      name: roadbook/bundle
      group: true
      disabled: !!js >-
        ((entry) => Boolean(entry?.options?.disabled?.__jsExpr
          ? entry.evaluate(entry.options.disabled.__jsExpr)
          : entry?.options?.disabled))
        ([...loader.entries()].find(entry => entry.options.id === 'roadbook'))
      config:
        - id: roadbook
          name: roadbook
          config:
            diagrams: docs/diagrams
        - id: roadbook-skills
          name: '@deepseek-ai/dsh-skill-filesystem'
          config:
            providerName: roadbook-plugin
            includeDefaultRoots: false
            bundledSkillDir: !!js process.getBuiltinModule('node:path').join(process.getBuiltinModule('node:path').dirname(process.getBuiltinModule('node:module').createRequire(baseUrl).resolve('roadbook/package.json')), 'skills')
        - id: roadbook-autoload
          name: roadbook/autoload
          config:
            mode: keyword
            skills:
              - roadbook
        - id: roadbook-atlas
          name: roadbook/atlas
          config:
            diagrams: docs/diagrams
