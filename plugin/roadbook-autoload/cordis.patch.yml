# Roadbook 自动加载插件（组合包 patch）
#
# 本文件把包挂进宿主：row 加载本包 main（./index.js）作为 Host 半区。
# 安装：Web 侧栏「插件」→ 添加插件 → 本地绝对路径 → 指向本目录（plugin/roadbook-autoload）→ 安装后「立即启用」。
# 改配置：直接改下面 config 里的值（mode: off 即可整体关掉），改完重新启用或刷新生效。
- insert:
    - id: roadbook-autoload
      name: roadbook-autoload
      config:
        mode: keyword
        skills:
          - roadbook
